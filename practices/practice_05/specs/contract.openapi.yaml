# Alias to the agreed contract for tooling that expects 'contract.openapi.yaml'
# See: contract.after.yaml (Agreed)

openapi: 3.1.0
info:
  title: Review Redaction API (Agreed)
  version: 1.0.0
servers:
  - url: http://localhost:8000
paths:
  /api/reviews:
    post:
      summary: Submit a diff for AI-assisted review with secret redaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diff]
              properties:
                diff:
                  type: string
                  description: Input diff; maximum length 20000 Unicode code points
      responses:
        '200':
          description: Review summary with at most three risks and checks
          content:
            application/json:
              schema:
                type: object
                required: [summary, risks, checks]
                properties:
                  summary:
                    type: string
                  risks:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      required: [risk]
                      properties:
                        file: { type: string }
                        line: { type: integer }
                        evidence: { type: string }
                        risk: { type: string }
                  checks:
                    type: array
                    items: { type: string }
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [UNPROCESSABLE_CONTENT]
                      message:
                        type: string
        '413':
          description: Content Too Large
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [CONTENT_TOO_LARGE]
                      message:
                        type: string
        '502':
          description: LLM upstream error (stubbed)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [LLM_UPSTREAM_ERROR]
                      message:
                        type: string
