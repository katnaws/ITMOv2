openapi: 3.1.0
info:
  title: Redaction & Review API v2 (Agreed)
  version: 2.0.0
servers:
  - url: http://localhost:8000
paths:
  /api/preview:
    post:
      summary: Preview a safely redacted version of the submitted diff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diff]
              properties:
                diff:
                  type: string
                  description: Original diff; server will redact secrets
      responses:
        '200':
          description: Redacted preview
          content:
            application/json:
              schema:
                type: object
                required: [redacted, redactions_count]
                properties:
                  redacted:
                    type: string
                  redactions_count:
                    type: integer
                    minimum: 0
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [UNPROCESSABLE_CONTENT]
                      message:
                        type: string
        '413':
          description: Content Too Large
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [CONTENT_TOO_LARGE]
                      message:
                        type: string

  /api/reviews:
    post:
      summary: Submit a diff for real LLM review (server redacts and calls provider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diff]
              properties:
                diff:
                  type: string
                  description: Original diff; server will redact before calling LLM
      responses:
        '200':
          description: Review summary with at most three risks and checks
          content:
            application/json:
              schema:
                type: object
                required: [summary, risks, checks]
                properties:
                  summary:
                    type: string
                  risks:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      required: [risk]
                      properties:
                        file: { type: string }
                        line: { type: integer }
                        evidence: { type: string }
                        risk: { type: string }
                  checks:
                    type: array
                    items: { type: string }
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [UNPROCESSABLE_CONTENT]
                      message:
                        type: string
        '413':
          description: Content Too Large
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [CONTENT_TOO_LARGE]
                      message:
                        type: string
        '502':
          description: LLM upstream error
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [LLM_UPSTREAM_ERROR]
                      message:
                        type: string
        '503':
          description: Provider not configured (no API key)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [PROVIDER_NOT_CONFIGURED]
                      message:
                        type: string

  /api/provider:
    get:
      summary: Provider status (no secrets)
      responses:
        '200':
          description: Provider info without secrets
          content:
            application/json:
              schema:
                type: object
                required: [provider, model, configured]
                properties:
                  provider: { type: string }
                  model: { type: string }
                  configured: { type: boolean }
